<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analytics · Panshul Jindal</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --accent:#9c5333; --accent-deep:#7d4128; --accent-tint:#f7efe9;
    --ink:#1c1917; --ink-2:#3d4757; --ink-3:#6b7688; --ink-4:#8e98a8;
    --bg:#faf8f4; --paper:#fffdfa; --line:#e8e2d8; --line-2:#d7dbe6;
    --ok:#0f9d58; --warn:#b8860b; --bad:#c0392b;
    --sans:"Plus Jakarta Sans",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1120px; margin:0 auto; padding:0 clamp(1rem,4vw,2rem);}

  header.top{border-bottom:1px solid var(--line); background:var(--paper);}
  .top-in{display:flex; align-items:center; gap:1rem; padding:1.1rem 0; flex-wrap:wrap;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; background:var(--accent);
    color:#fff; display:grid; place-items:center; font-weight:800; letter-spacing:-.02em;
  }
  .top h1{font-size:1.05rem; margin:0; letter-spacing:-.02em;}
  .top .sub{color:var(--ink-3); font-size:.82rem;}
  .top .spacer{flex:1;}
  .top a.back{color:var(--ink-2); text-decoration:none; font-size:.85rem; font-weight:600;}
  .top a.back:hover{color:var(--accent);}

  /* ---------- gate ---------- */
  .gate{max-width:22rem; margin:18vh auto; text-align:center;}
  .gate h2{font-size:1.35rem; letter-spacing:-.02em; margin:0 0 .35rem;}
  .gate p{color:var(--ink-3); font-size:.88rem; margin:0 0 1.4rem;}
  .field{display:flex; gap:.5rem;}
  input[type=password], select{
    font:inherit; font-size:.92rem; padding:.7rem .85rem; border-radius:10px;
    border:1px solid var(--line-2); background:var(--paper); color:var(--ink);
    width:100%; transition:border-color .18s, box-shadow .18s;
  }
  input:focus, select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);
  }
  button{
    font:inherit; font-weight:700; font-size:.9rem; cursor:pointer;
    padding:.7rem 1.1rem; border-radius:10px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; transition:background .18s, transform .12s;
    white-space:nowrap;
  }
  button:hover{background:var(--accent-deep);}
  button:active{transform:translateY(1px);}
  button[disabled]{opacity:.55; cursor:not-allowed;}
  .err{color:var(--bad); font-size:.85rem; margin-top:.9rem; min-height:1.2em;}

  /* ---------- controls ---------- */
  .controls{display:flex; gap:.6rem; align-items:center; padding:1.3rem 0; flex-wrap:wrap;}
  .controls select{width:auto; padding-right:2rem;}
  .controls .note{color:var(--ink-4); font-size:.8rem; margin-left:auto;}

  /* ---------- cards ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:.9rem; margin-bottom:1.3rem;}
  .kpi{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:1.1rem 1.2rem;
  }
  .kpi .n{font-size:1.9rem; font-weight:800; letter-spacing:-.03em; line-height:1.1;}
  .kpi .k{color:var(--ink-3); font-size:.76rem; text-transform:uppercase; letter-spacing:.09em; font-weight:700; margin-top:.2rem;}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem;}
  .panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:1.15rem 1.25rem 1.3rem; min-width:0;
  }
  .panel.full{grid-column:1 / -1;}
  .panel h3{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.09em;
    color:var(--ink-3); margin:0 0 1rem; font-weight:700;
  }

  /* ---------- bar rows ---------- */
  .rows{display:flex; flex-direction:column; gap:.5rem;}
  .row{position:relative; display:flex; align-items:center; gap:.7rem; font-size:.86rem; padding:.3rem .5rem; border-radius:7px; overflow:hidden;}
  .row .bar{position:absolute; inset:0 auto 0 0; background:var(--accent-tint); border-radius:7px; z-index:0;}
  .row .lbl{position:relative; z-index:1; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .val{position:relative; z-index:1; font-family:var(--mono); font-size:.78rem; color:var(--ink-2); font-weight:500;}
  .row .tag{
    position:relative; z-index:1; font-size:.66rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--accent); background:#fff; border:1px solid var(--line);
    border-radius:5px; padding:.05rem .3rem;
  }
  .empty{color:var(--ink-4); font-size:.85rem; font-style:italic;}

  /* ---------- sparkline ---------- */
  .spark{width:100%; height:150px; display:block;}
  .spark .ln{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  .spark .ar{fill:var(--accent); opacity:.09;}
  .spark .dot{fill:var(--accent);}
  .spark .ax{stroke:var(--line); stroke-width:1;}
  .spark text{font-family:var(--mono); font-size:9px; fill:var(--ink-4);}

  .vital{display:flex; align-items:baseline; gap:.55rem; padding:.45rem 0; border-bottom:1px solid var(--line);}
  .vital:last-child{border-bottom:0;}
  .vital .m{font-weight:700; width:3.2rem;}
  .vital .v{font-family:var(--mono); font-size:.9rem;}
  .vital .j{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-left:auto;}
  .j.good{color:var(--ok);} .j.mid{color:var(--warn);} .j.poor{color:var(--bad);}

  .setup{
    background:var(--accent-tint); border:1px solid #e0cdbd; border-radius:var(--radius);
    padding:1.2rem 1.3rem; margin-bottom:1.3rem; font-size:.88rem;
  }
  .setup h3{margin:0 0 .5rem; font-size:.95rem; color:var(--accent-deep);}
  .setup ol{margin:.5rem 0 0; padding-left:1.1rem;}
  .setup li{margin-bottom:.35rem;}
  .setup code{font-family:var(--mono); font-size:.82em; background:#fff; border:1px solid #e0cdbd; border-radius:4px; padding:.05rem .3rem;}

  @media (max-width:880px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .grid{grid-template-columns:1fr;}
  }
  @media (max-width:420px){
    .kpis{grid-template-columns:1fr;}
    .controls .note{margin-left:0; width:100%;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="shell top-in">
    <span class="brand-mark">PJ</span>
    <div>
      <h1>Analytics</h1>
      <div class="sub">panshuljindal.com</div>
    </div>
    <span class="spacer"></span>
    <a class="back" href="index.html">← Back to site</a>
  </div>
</header>

<main class="shell">

  <!-- password gate -->
  <section class="gate" id="gate">
    <h2>Private dashboard</h2>
    <p>Enter the dashboard password.</p>
    <form class="field" id="gate-form">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" id="go">View</button>
    </form>
    <div class="err" id="gate-err"></div>
  </section>

  <!-- dashboard -->
  <section id="dash" hidden>
    <div class="controls">
      <select id="days">
        <option value="1">Last 24 hours</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button id="refresh">Refresh</button>
      <span class="note" id="note"></span>
    </div>

    <div id="warn"></div>

    <div class="kpis">
      <div class="kpi"><div class="n" id="k-views">–</div><div class="k">Page views</div></div>
      <div class="kpi"><div class="n" id="k-sessions">–</div><div class="k">Sessions</div></div>
      <div class="kpi"><div class="n" id="k-reads">–</div><div class="k">Reads finished</div></div>
      <div class="kpi"><div class="n" id="k-clicks">–</div><div class="k">Outbound clicks</div></div>
    </div>

    <div class="grid">
      <div class="panel full">
        <h3>Page views over time</h3>
        <svg class="spark" id="chart" viewBox="0 0 900 150" preserveAspectRatio="none" role="img" aria-label="Page views per day"></svg>
      </div>

      <div class="panel"><h3>Top pages</h3><div class="rows" id="p-pages"></div></div>
      <div class="panel"><h3>Referrers</h3><div class="rows" id="p-refs"></div></div>
      <div class="panel"><h3>Countries</h3><div class="rows" id="p-countries"></div></div>
      <div class="panel"><h3>Devices</h3><div class="rows" id="p-devices"></div></div>
      <div class="panel"><h3>Sections viewed</h3><div class="rows" id="p-sections"></div></div>
      <div class="panel"><h3>Scroll depth</h3><div class="rows" id="p-depth"></div></div>
      <div class="panel"><h3>Clicks</h3><div class="rows" id="p-clicks"></div></div>
      <div class="panel"><h3>Core Web Vitals</h3><div id="p-vitals"></div></div>
      <div class="panel full"><h3>All events</h3><div class="rows" id="p-totals"></div></div>
    </div>
  </section>
</main>

<script>
(function () {
  var pw = '';
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return (n || 0).toLocaleString(); };

  function rows(el, list, labelKey, opts) {
    opts = opts || {};
    el.innerHTML = '';
    if (!list || !list.length) {
      el.innerHTML = '<div class="empty">No data yet.</div>';
      return;
    }
    var max = list.reduce(function (m, r) { return Math.max(m, +r.hits || 0); }, 0) || 1;
    list.forEach(function (r) {
      var hits = +r.hits || 0;
      var label = r[labelKey];
      if (label === '' || label === null || label === undefined) label = '(none)';
      if (opts.host) { try { label = new URL(label).hostname; } catch (e) {} }

      var d = document.createElement('div');
      d.className = 'row';
      d.innerHTML =
        '<span class="bar" style="width:' + (hits / max * 100).toFixed(1) + '%"></span>' +
        (r.kind ? '<span class="tag"></span>' : '') +
        '<span class="lbl"></span><span class="val">' + fmt(hits) + '</span>';
      if (r.kind) d.querySelector('.tag').textContent = r.kind;
      d.querySelector('.lbl').textContent = label;
      d.title = label;
      el.appendChild(d);
    });
  }

  function chart(daily) {
    var svg = $('chart');
    svg.innerHTML = '';
    if (!daily || daily.length < 2) {
      svg.innerHTML = '<text x="14" y="76" style="font-size:12px">Not enough data to plot yet.</text>';
      return;
    }
    var W = 900, H = 150, pad = 24;
    var vals = daily.map(function (d) { return +d.hits || 0; });
    var max = Math.max.apply(null, vals) || 1;
    var step = (W - pad * 2) / (daily.length - 1);
    var pts = vals.map(function (v, i) {
      return [pad + i * step, H - pad - (v / max) * (H - pad * 2)];
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    var area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ',' + (H - pad) + ' L' + pad + ',' + (H - pad) + ' Z';

    var ns = 'http://www.w3.org/2000/svg';
    function add(tag, attrs, text) {
      var e = document.createElementNS(ns, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (text != null) e.textContent = text;
      svg.appendChild(e);
      return e;
    }
    add('line', { class: 'ax', x1: pad, y1: H - pad, x2: W - pad, y2: H - pad });
    add('path', { class: 'ar', d: area });
    add('path', { class: 'ln', d: line });
    pts.forEach(function (p) { add('circle', { class: 'dot', cx: p[0], cy: p[1], r: 2.5 }); });
    add('text', { x: pad, y: 14 }, 'peak ' + fmt(max));
    add('text', { x: pad, y: H - 6 }, String(daily[0].day).slice(5));
    add('text', { x: W - pad, y: H - 6, 'text-anchor': 'end' }, String(daily[daily.length - 1].day).slice(5));
  }

  // Thresholds are Google's "good / needs improvement" boundaries.
  var VITALS = { LCP: [2500, 4000, 'ms'], INP: [200, 500, 'ms'], CLS: [100, 250, ''] };
  function vitals(list) {
    var el = $('p-vitals');
    el.innerHTML = '';
    if (!list || !list.length) { el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
    list.forEach(function (r) {
      var t = VITALS[r.metric] || [Infinity, Infinity, ''];
      var avg = +r.avg || 0;
      // CLS is sent multiplied by 1000 to survive the integer transport.
      var shown = r.metric === 'CLS' ? (avg / 1000).toFixed(3) : Math.round(avg) + t[2];
      var cls = avg <= t[0] ? 'good' : avg <= t[1] ? 'mid' : 'poor';
      var d = document.createElement('div');
      d.className = 'vital';
      d.innerHTML = '<span class="m">' + r.metric + '</span><span class="v">' + shown + '</span>' +
                    '<span class="j ' + cls + '">' + (cls === 'good' ? 'good' : cls === 'mid' ? 'needs work' : 'poor') + '</span>';
      el.appendChild(d);
    });
  }

  function sum(list, kinds) {
    if (!list) return 0;
    return list.reduce(function (t, r) {
      return kinds.indexOf(r.kind) > -1 ? t + (+r.hits || 0) : t;
    }, 0);
  }

  function render(res) {
    var d = res.data;
    $('k-views').textContent = fmt(sum(d.totals, ['pageview']));
    $('k-sessions').textContent = fmt(d.sessionCount);
    $('k-reads').textContent = fmt(sum(d.totals, ['read_complete']));
    $('k-clicks').textContent = fmt(sum(d.totals, ['outbound', 'download']));

    chart(d.daily);
    rows($('p-pages'), d.pages, 'path');
    rows($('p-refs'), d.referrers, 'ref', { host: true });
    rows($('p-countries'), d.countries, 'country');
    rows($('p-devices'), d.devices, 'device');
    rows($('p-sections'), d.sections, 'section');
    rows($('p-depth'), d.depth, 'bucket');
    rows($('p-clicks'), d.clicks, 'label');
    rows($('p-totals'), d.totals, 'kind');
    vitals(d.vitals);

    $('note').textContent = 'Updated ' + new Date().toLocaleTimeString();
    $('warn').innerHTML = '';
    if (res.errors) {
      // The same failure usually hits every query; say it once.
      var seen = {};
      Object.keys(res.errors).forEach(function (k) {
        var m = String(res.errors[k]);
        (seen[m] = seen[m] || []).push(k);
      });
      var box = document.createElement('div');
      box.className = 'setup';
      box.innerHTML = '<h3>Some queries failed</h3>' +
        Object.keys(seen).map(function (m) {
          return '<div><code>' + seen[m].join('</code> <code>') + '</code><br>' +
                 m.replace(/</g, '&lt;').slice(0, 400) + '</div>';
        }).join('');
      $('warn').appendChild(box);
    }
  }

  function setupHelp(msg) {
    return '<div class="setup"><h3>Analytics is not configured yet</h3>' +
      '<div>' + String(msg).replace(/</g, '&lt;') + '</div>' +
      '<ol>' +
      '<li>Cloudflare dashboard → <b>Workers &amp; Pages</b> → your Pages project → <b>Settings</b>.</li>' +
      '<li><b>Bindings</b> → add an <b>Analytics Engine</b> binding: variable <code>ANALYTICS</code>, dataset <code>portfolio_analytics</code>.</li>' +
      '<li><b>Variables and secrets</b> → add <code>CF_ACCOUNT_ID</code>, and as secrets <code>CF_API_TOKEN</code> (needs <i>Account Analytics: Read</i>) and <code>STATS_PASSWORD</code>.</li>' +
      '<li>Redeploy so the new bindings attach, then reload this page.</li>' +
      '</ol></div>';
  }

  function load() {
    var btn = $('refresh');
    btn.disabled = true;
    $('note').textContent = 'Loading…';

    return fetch('/api/stats', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pw, days: +$('days').value })
    }).then(function (r) {
      return r.json().catch(function () {
        throw new Error(r.status === 404
          ? 'The /api/stats function is not deployed. Cloudflare Pages Functions are not running for this project.'
          : 'Unexpected response (HTTP ' + r.status + ').');
      }).then(function (j) { return { status: r.status, body: j }; });
    }).then(function (out) {
      if (out.status === 401) throw new Error('Wrong password.');
      if (!out.body.ok) {
        $('warn').innerHTML = setupHelp(out.body.error || 'Unknown error.');
        $('note').textContent = '';
        return;
      }
      render(out.body);
    }).catch(function (e) {
      $('note').textContent = '';
      $('warn').innerHTML = setupHelp(e.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  $('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true;
    $('gate-err').textContent = '';

    fetch('/api/stats', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pw, days: 7 })
    }).then(function (r) {
      if (r.status === 401) { $('gate-err').textContent = 'Wrong password.'; $('go').disabled = false; return; }
      // Anything else (including "not configured") gets through to the
      // dashboard, which explains what is missing.
      try { sessionStorage.setItem('pj_stats_pw', pw); } catch (err) {}
      $('gate').hidden = true;
      $('dash').hidden = false;
      load();
    }).catch(function () {
      $('gate').hidden = true;
      $('dash').hidden = false;
      load();
    });
  });

  $('refresh').addEventListener('click', load);
  $('days').addEventListener('change', load);

  try {
    var saved = sessionStorage.getItem('pj_stats_pw');
    if (saved) { pw = saved; $('gate').hidden = true; $('dash').hidden = false; load(); }
  } catch (e) {}
})();
</script>
</body>
</html>
